{% extends "base.html" %}
{% block title %}{{ t('auth.register_title') }} — VarVar.az{% endblock %}
{% block content %}
<div class="wrap narrow-form">
  <div class="form-card">
    <h1 class="form-page-title" style="font-size:24px;">{{ t('auth.register_title') }}</h1>
    <p class="form-page-sub">{{ t('auth.register_sub') }}</p>
    <form method="post">
      <div class="field">
        <label>{{ t('auth.fullname') }}</label>
        <input type="text" name="full_name" required value="{{ form.full_name if form else '' }}">
      </div>
      <div class="field">
        <label>{{ t('auth.phone') }}</label>
        <input type="text" name="phone" placeholder="0501234567" required value="{{ form.phone if form else '' }}">
      </div>
      <div class="field">
        <label>E-poçt</label>
        <input type="email" name="email" value="{{ form.email if form else '' }}">
      </div>
      <div class="field">
        <label>{{ t('auth.password') }}</label>
        <input type="password" name="password" required minlength="6">
      </div>
      <button type="submit" class="btn btn-brass btn-block">{{ t('auth.register_title') }}</button>
    </form>
    <p style="text-align:center;margin-top:18px;font-size:14px;color:var(--ink-soft);">
      {{ t('auth.have_account') }} <a href="{{ url_for('login') }}" style="color:var(--teal);font-weight:600;">{{ t('auth.login_title') }}</a>
    </p>
  </div>
</div>
{% endblock %}
