{% extends "base.html" %}
{% block title %}Şifrəni sıfırla — VarAz{% endblock %}
{% block content %}
<div class="wrap narrow-form">
  <div class="form-card">
    <h1 class="form-page-title" style="font-size:22px;">Yeni şifrə təyin edin</h1>
    <form method="post">
      <div class="field">
        <label>Yeni şifrə</label>
        <input type="password" name="password" minlength="6" required autofocus>
      </div>
      <button type="submit" class="btn btn-brass btn-block">Şifrəni yenilə</button>
    </form>
  </div>
</div>
{% endblock %}
